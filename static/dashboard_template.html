<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>金羅盤</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* 配色取自臺灣企銀官網：橘紅主色、黃輔色、米白底、暖灰框線。
     漲跌色維持台股慣例（漲紅跌綠），不跟品牌橘混用。 */
  :root {
    --brand: #da3700;
    --brand-dark: #b02e00;
    --brand-soft: #ffead7;
    --cream: #fffbf8;
    --cream-2: #fff5e8;
    --yellow: #fabe00;
    --text: #333333;
    --text-soft: #73625c;
    --line: #d6d0c9;
    --up: #c62828;
    --down: #287d3a;
    --cold: #4a6f8f;
    --cold-bar: #b8c7d6;
    --mid-bar: #e9e2d9;
    --hot-bar: #f2a58a;
    --ok-bg: #e8f3ea;
    --ok: #1f6b30;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--text); font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; font-size: 15px; line-height: 1.55; }
  a { color: var(--brand-dark); }
  h1, h2, h3, p { margin: 0; }

  .topbar { background: var(--brand); color: #fff; }
  .topbar-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .topbar h1 { display: inline; font-size: 22px; font-weight: 700; }
  .brand-sub { font-size: 12px; letter-spacing: 0.25em; opacity: 0.85; margin-left: 10px; }
  .brand-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .home { color: #fff; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 999px; opacity: 0.92; }
  .home:hover { background: rgba(255, 255, 255, 0.16); opacity: 1; }
  .home:focus-visible, .plan-link:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .plan-link { color: var(--brand-dark); background: var(--yellow); text-decoration: none; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
  .plan-link:hover { background: #fff; }
  .status { font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .live-dot { display: inline-block; width: 9px; height: 9px; border-radius: 999px; background: #22a447; margin-right: 6px; vertical-align: middle; }
  .status .live-dot { background: var(--yellow); margin-right: 0; }
  .disclaimer { background: var(--cream-2); color: var(--text-soft); font-size: 12.5px; text-align: center; padding: 6px 16px; border-bottom: 1px solid var(--brand-soft); }

  .shell { max-width: 1240px; margin: 0 auto; padding: 14px 16px 40px; }

  .target-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .tcard { text-align: left; font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .tcard:hover { border-color: var(--brand); }
  .tcard.active { border: 2px solid var(--brand); padding: 11px 13px; box-shadow: 0 4px 14px rgba(218, 55, 0, 0.15); }
  .tcard-name { font-size: 13px; color: var(--text-soft); }
  .tcard-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 2px 0 6px; flex-wrap: wrap; }
  .tcard-price { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .chg { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }
  .chg.flat { color: var(--text-soft); }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--cream-2); color: var(--brand-dark); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--brand-soft); color: var(--brand-dark); }

  .main { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 14px; align-items: stretch; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  /* 兩欄高度不同時，讓各欄最後一張卡片拉長補滿，底部不留空白 */
  .stack > :last-child { flex: 1 1 auto; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .note { font-size: 12.5px; color: var(--text-soft); line-height: 1.5; }

  .hero-label { font-size: 13px; color: var(--text-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hero-price { display: flex; align-items: baseline; gap: 12px; margin: 2px 0; flex-wrap: wrap; }
  .hero-price .num { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .hero-price .chg { font-size: 18px; }
  .quote-line { font-size: 13px; color: var(--text-soft); }
  .divider { height: 1px; background: var(--brand-soft); margin: 12px 0; }

  .steps { display: flex; gap: 4px; }
  .step { flex: 1; height: 10px; border-radius: 5px; background: var(--cream-2); border: 1px solid var(--brand-soft); }
  .step.passed { background: #f4b79f; border-color: #f4b79f; }
  .step.current { background: var(--brand); border-color: var(--brand); }
  .step-labels { display: flex; gap: 4px; font-size: 12px; color: var(--text-soft); margin-top: 3px; }
  .step-labels span { flex: 1; text-align: center; }
  .step-labels span.current { color: var(--brand-dark); font-weight: 700; }
  .stage-line { font-size: 17px; font-weight: 700; color: var(--brand-dark); margin-top: 10px; }
  .stage-hint { font-size: 14px; margin-top: 2px; }
  .signal-row { margin-top: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .fact { background: var(--cream-2); border-radius: 8px; padding: 6px 10px; }
  .fact.warn { background: var(--brand-soft); }
  .fact.warn b { color: var(--brand-dark); }
  .fact b { display: block; font-size: 16px; }
  .fact span { font-size: 12px; color: var(--text-soft); }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .section-head h2 { margin: 0; }
  .legend { font-size: 12.5px; color: var(--text-soft); display: flex; gap: 12px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .ind-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ind { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .ind-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ind-name { font-size: 15px; font-weight: 700; }
  .ind-name small { display: block; font-size: 12px; font-weight: 400; color: var(--text-soft); }
  .ind-value { font-size: 30px; font-weight: 700; line-height: 1.1; text-align: right; white-space: nowrap; }
  .ind-sub { font-size: 12.5px; color: var(--text-soft); text-align: right; }
  .zonewrap { position: relative; margin-top: 8px; }
  .zonebar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
  .zone.cold { background: var(--cold-bar); }
  .zone.mid { background: var(--mid-bar); }
  .zone.hot { background: var(--hot-bar); }
  .zonemark { position: absolute; top: -3px; width: 4px; height: 16px; background: var(--text); border-radius: 2px; transform: translateX(-2px); }
  .zonelabels { display: flex; font-size: 12px; color: var(--text-soft); margin-top: 3px; }
  .zonelabels span { text-align: center; white-space: nowrap; overflow: hidden; }
  .verdict { font-size: 14.5px; font-weight: 700; margin-top: 6px; }
  .verdict.cold { color: var(--cold); }
  .verdict.hot { color: var(--brand-dark); }
  .plain { font-size: 12.5px; color: var(--text-soft); line-height: 1.5; }

  .row-b { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; margin-top: 14px; }
  .score-big { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .score-big .num { font-size: 36px; font-weight: 700; color: var(--brand); line-height: 1.1; }
  .score-big .num small { font-size: 15px; }
  .score-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .score-chips .chip { background: var(--cream-2); color: var(--text); font-weight: 400; }
  .ai-text { font-size: 15px; line-height: 1.7; }
  .macro-big { display: flex; align-items: baseline; gap: 10px; }
  .macro-big .num { font-size: 28px; font-weight: 700; }
  .spark { display: block; width: 100%; }
  .range-line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }

  details.fold { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; margin-top: 12px; }
  details.fold summary { padding: 12px 0; font-weight: 700; cursor: pointer; }
  details.fold .fold-body { padding: 0 0 14px; font-size: 14px; }
  details.fold .fold-body p { margin-top: 6px; }
  .rule-list { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px; line-height: 1.7; }
  .footer-note { margin-top: 14px; font-size: 12.5px; color: var(--text-soft); }

  /* 我的黃金購買計畫 */
  .plan { margin-top: 22px; scroll-margin-top: 12px; }
  .plan-banner { background: #f6e3a6; border-radius: 12px 12px 0 0; padding: 16px 20px; }
  .plan-banner h2 { font-size: 24px; font-weight: 800; letter-spacing: 0.04em; color: #2b2118; }
  .plan-banner p { margin-top: 4px; font-size: 14.5px; color: #5a4632; }
  .plan-body { background: #f8f2df; border: 1px solid #ecdcae; border-top: 0; border-radius: 0 0 12px 12px; padding: 16px; }
  .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 14px; }
  .plan-step { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .plan-step h3 { font-size: 16px; display: flex; align-items: center; gap: 8px; margin: 0; }
  .plan-step h3 .no { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 13px; }
  .plan-step .lead { font-size: 13px; color: var(--text-soft); margin-top: -4px; }
  .plan-field { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 700; }
  .plan-field small { font-weight: 400; color: var(--text-soft); font-size: 12px; }
  .plan-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .plan input[type="number"], .plan input[type="date"], .plan input[type="text"], .plan select { font: inherit; font-size: 14px; font-weight: 400; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; color: var(--text); width: 100%; min-width: 0; }
  .plan input:focus-visible, .plan select:focus-visible, .plan button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }
  .plan-checks { display: flex; flex-direction: column; gap: 6px; }
  .plan-check { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; line-height: 1.5; font-weight: 400; }
  .plan-check input { margin-top: 4px; accent-color: var(--brand); flex: 0 0 auto; }
  .plan-out { background: var(--cream-2); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; line-height: 1.6; }
  .plan-out b { color: var(--brand-dark); }
  .plan-warn { background: var(--brand-soft); color: var(--brand-dark); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 1.55; }
  .plan-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .plan-table th, .plan-table td { padding: 6px 8px; border-bottom: 1px solid var(--brand-soft); text-align: right; white-space: nowrap; }
  .plan-table th:first-child, .plan-table td:first-child { text-align: left; white-space: normal; }
  .plan-table th { font-size: 12px; color: var(--text-soft); font-weight: 400; }
  .plan-table tr.over td { color: var(--brand-dark); font-weight: 700; background: #fff1ea; }
  .plan-summary { margin-top: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .plan-summary h3 { font-size: 16px; margin: 0 0 8px; }
  .plan-summary pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 14px; line-height: 1.75; }
  .plan-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .plan-actions button { font: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 7px 16px; cursor: pointer; border: 1px solid var(--brand); background: #fff; color: var(--brand-dark); }
  .plan-actions button.primary { background: var(--brand); color: #fff; }
  .plan-actions .note { margin-left: auto; }
  @media (max-width: 620px) {
    .plan-banner { padding: 14px; }
    .plan-banner h2 { font-size: 19px; }
    .plan-body { padding: 10px; }
    .plan-grid { grid-template-columns: minmax(0, 1fr); }
    .plan-step { padding: 12px; }
    .plan-table th, .plan-table td { padding: 6px 4px; font-size: 13px; }
    .plan-actions .note { margin-left: 0; }
    .plan-link { padding: 4px 10px; }
    .topbar-right { gap: 8px; }
    .topbar-right .status { font-size: 12px; }
  }
  @media print {
    body { background: #fff; }
    body * { visibility: hidden; }
    #plan-summary, #plan-summary * { visibility: visible; }
    #plan-summary { position: absolute; left: 0; top: 0; width: 100%; border: 0; }
    #plan-summary .plan-actions { display: none; }
  }

  /* AI 小幫手（金福企） */
  .shell { padding-bottom: 84px; }
  .assistant-fab { position: fixed; right: 16px; bottom: 16px; z-index: 60; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px; color: #fff; background: var(--brand); padding: 12px 20px; border-radius: 999px; box-shadow: 0 8px 22px rgba(218, 55, 0, 0.35); }
  .assistant-fab:hover { background: var(--brand-dark); }
  .assistant-fab:focus-visible, .assistant-panel button:focus-visible, .assistant-panel input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .assistant-panel { position: fixed; right: 16px; bottom: 72px; z-index: 60; width: min(380px, calc(100vw - 32px)); height: min(540px, calc(100vh - 96px)); background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 40px rgba(51, 51, 51, 0.22); display: none; flex-direction: column; overflow: hidden; }
  .assistant-panel.open { display: flex; }
  .assistant-head { background: var(--brand); color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
  .assistant-head b { font-size: 15px; }
  .assistant-head button { background: transparent; border: 0; color: #fff; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; }
  .assistant-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--cream); }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--brand-soft); }
  .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--line); }
  .msg.error { border-style: dashed; color: var(--brand-dark); }
  .msg.typing { color: var(--text-soft); }
  .assistant-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px 0; background: #fff; max-height: 112px; overflow-y: auto; }
  .assistant-chips button { font: inherit; font-size: 12.5px; background: var(--cream-2); color: var(--brand-dark); border: 1px solid var(--brand-soft); border-radius: 999px; padding: 4px 10px; cursor: pointer; text-align: left; }
  .assistant-chips button:hover { background: var(--brand-soft); }
  .assistant-form { display: flex; gap: 8px; padding: 8px 12px; background: #fff; }
  .assistant-form input { flex: 1; min-width: 0; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
  .assistant-form button { font: inherit; font-weight: 700; font-size: 14px; color: #fff; background: var(--brand); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .assistant-form button:disabled { background: var(--line); cursor: default; }
  .assistant-note { padding: 0 12px 10px; font-size: 11.5px; color: var(--text-soft); background: #fff; line-height: 1.4; }
  @media (max-width: 620px) {
    .assistant-panel { right: 8px; left: 8px; width: auto; bottom: 66px; }
    .assistant-fab { right: 10px; bottom: 10px; }
  }

  @media (max-width: 1020px) {
    .main { grid-template-columns: 1fr; }
    .ind-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row-b { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    .shell { padding: 10px 10px 32px; }
    .target-cards { gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tcard { padding: 8px 9px; }
    .tcard.active { padding: 7px 8px; }
    .tcard-price { font-size: 19px; }
    .tcard-row { flex-direction: column; align-items: flex-start; gap: 0; }
    .tcard .chip { font-size: 11px; padding: 1px 7px; }
    .ind-grid { grid-template-columns: 1fr; }
    .hero-price .num { font-size: 34px; }
    .brand-sub { display: none; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-line">
        <a class="home" href="index.html" aria-label="回首頁" title="回首頁"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-5h3v5h5V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></a>
        <div><h1>金羅盤</h1><span class="brand-sub">GOLD COMPASS</span></div>
      </div>
      <div class="topbar-right">
        <a class="plan-link" href="#plan">我的購買計畫</a>
        <div class="status"><span class="live-dot"></span><span id="page-updated-line">更新 <span id="page-updated-time">--:--:--</span></span></div>
      </div>
    </div>
  </header>
  <div class="disclaimer" id="disclaimer"></div>
  <main class="shell">
    <nav class="target-cards" id="target-tabs" aria-label="選擇標的"></nav>
    <section id="target-view"></section>
    <!-- 購買計畫放在 target-view 外面：標的區每 15 秒會整個重畫，放裡面的話輸入到一半會被清掉。 -->
    <section id="plan" class="plan" aria-labelledby="plan-title"></section>
  </main>
<script>
const SITE_DATA = __DATA__;

const STAGES = [
  "觀察區（尚未回檔到位）",
  "第一筆 20%",
  "加碼 20%（前提：趨勢沒壞）",
  "加碼 20%（前提：出現止跌）",
  "最後 40%（等重新轉強）",
];
const STAGE_SHORT = ["觀察區", "第一筆 20%", "加碼 20%", "加碼 20%", "最後 40%"];
const SHORT_NAMES = {
  GCF: "國際金價 COMEX",
  TBBGOLD: "台企銀黃金存摺",
  "00635U": "元大S&P黃金",
  "00708L": "黃金正2（2倍）",
};
const SCORE_ITEM_LABELS = { rsi14: "RSI", bollinger: "布林", ma20: "MA20", macd: "MACD" };

let currentTargetCode = null;
const foldState = {};

function fmt(value, digits) {
  if (value === null || value === undefined) return "資料不足";
  return value.toFixed(digits);
}

// 價格小數位數跟著標的走：台企銀牌價是整數元／公克，其餘 2 位。
function fmtPrice(value, target) {
  if (value === null || value === undefined) return "—";
  const digits = target && target.price_digits !== undefined ? target.price_digits : 2;
  return value.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function clamp(value, lo, hi) {
  return Math.max(lo, Math.min(hi, value));
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  (children || []).forEach((child) => node.appendChild(child));
  return node;
}

function shortName(target) {
  return SHORT_NAMES[target.code] || target.display_name;
}

// 固定順序：國際金價是兩檔台股 ETF 的定價基礎，放最前面。
const TARGET_ORDER = ["GCF", "TBBGOLD", "00635U", "00708L"];
function orderedCodes() {
  const rank = (code) => (TARGET_ORDER.indexOf(code) < 0 ? 99 : TARGET_ORDER.indexOf(code));
  return Object.keys(SITE_DATA.targets).sort((a, b) => rank(a) - rank(b));
}

function stageIndex(stage) {
  return STAGES.indexOf(stage);
}

function renderDisclaimer() {
  document.getElementById("disclaimer").textContent = SITE_DATA.disclaimer;
}

function formatClock(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
}

function markPageUpdatedNow() {
  const node = document.getElementById("page-updated-time");
  if (node) node.textContent = formatClock(new Date());
}

function latestCheckedDate() {
  const candidates = [SITE_DATA.generated_at, SITE_DATA.live_quotes_generated_at]
    .filter(Boolean)
    .map((iso) => new Date(iso))
    .filter((d) => !isNaN(d.getTime()));
  if (candidates.length === 0) return null;
  return new Date(Math.max(...candidates.map((d) => d.getTime())));
}

function formatBuildCheckedTime() {
  const date = latestCheckedDate();
  return date ? formatClock(date) : null;
}

// ---- 價格與漲跌 -------------------------------------------------------

function priceInfo(target) {
  const price = target.latest.close;
  let ref = target.latest.prev_close;
  if ((ref === null || ref === undefined) && target.chart && target.chart.length > 1) {
    ref = target.chart[target.chart.length - 2].close;
  }
  const abs = ref ? price - ref : null;
  const pct = ref ? (abs / ref) * 100 : null;
  return { price: price, ref: ref, abs: abs, pct: pct };
}

function changeNode(info) {
  if (info.pct === null || info.pct === undefined) return el("span", { className: "chg flat", textContent: "—" });
  const cls = info.pct > 0.005 ? "up" : info.pct < -0.005 ? "down" : "flat";
  const arrow = info.pct > 0.005 ? "▲ +" : info.pct < -0.005 ? "▼ −" : "";
  return el("span", { className: "chg " + cls, textContent: arrow + Math.abs(info.pct).toFixed(2) + "%" });
}

function quoteLine(target) {
  const line = el("p", { className: "quote-line" });
  if (target.passbook_quote) {
    line.appendChild(
      document.createTextNode(
        "本行賣出價（你向銀行買進的價格）　掛牌時間 " + target.passbook_quote.listed_at + "，銀行牌價非即時行情"
      )
    );
    return line;
  }
  if (target.latest.is_realtime) {
    line.appendChild(el("span", { className: "live-dot" }));
    let text = "盤中即時價 " + (target.latest.quote_time || "") + "，非官方公告價";
    if (target.quote_delay_note) text += "（Yahoo 免費報價約延遲 10 分鐘）";
    line.appendChild(document.createTextNode(text));
  } else {
    const checked = formatBuildCheckedTime();
    line.appendChild(
      document.createTextNode(
        "最新收盤 " + target.latest.trading_date + "（非即時" + (checked ? "，" + checked + " 查核仍為最新" : "") + "）"
      )
    );
  }
  return line;
}

function renderTargetTabs() {
  const bar = document.getElementById("target-tabs");
  bar.innerHTML = "";
  orderedCodes().forEach((code) => {
    const target = SITE_DATA.targets[code];
    const info = priceInfo(target);
    const btn = el("button", { className: "tcard", type: "button" });
    btn.dataset.code = code;
    btn.appendChild(el("div", { className: "tcard-name", textContent: shortName(target) + "　" + code }));
    const row = el("div", { className: "tcard-row" });
    row.appendChild(el("span", { className: "tcard-price", textContent: fmtPrice(info.price, target) }));
    row.appendChild(changeNode(info));
    btn.appendChild(row);
    const ps = target.indicators.pullback_stage;
    if (ps) {
      const idx = stageIndex(ps.stage);
      btn.appendChild(
        el("span", { className: "chip" + (idx > 0 ? " warn" : ""), textContent: "階段：" + (STAGE_SHORT[idx] || ps.stage) })
      );
    }
    btn.addEventListener("click", () => renderTarget(code));
    bar.appendChild(btn);
  });
  updateTabActiveState();
}

function updateTabActiveState() {
  document.querySelectorAll("#target-tabs .tcard").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.code === currentTargetCode);
  });
}

function stageSignalInfo(stage, signals) {
  if (!signals) return null;
  if (stage === STAGES[2]) return { label: "趨勢是否還沒壞（現價在月均線上且未破前低）", value: signals.trend_intact };
  if (stage === STAGES[3]) return { label: "是否已經止跌（力道回升且沒再創新低）", value: signals.momentum_stabilizing };
  if (stage === STAGES[4]) return { label: "是否重新轉強（MACD 黃金交叉）", value: signals.macd_golden_cross };
  return null;
}

function signalChip(value) {
  const text = value === true ? "✓ 符合" : value === false ? "✗ 尚未符合" : "資料不足";
  const cls = value === true ? "chip ok" : value === false ? "chip warn" : "chip";
  return el("span", { className: cls, textContent: text });
}

// ---- 走勢圖 -----------------------------------------------------------

function sparklinePath(points, width, height, padding, lo, hi) {
  if (points.length === 0) return "";
  const range = hi - lo || 1;
  const stepX = (width - padding * 2) / Math.max(points.length - 1, 1);
  return points
    .map((p, i) => {
      const x = padding + i * stepX;
      const y = padding + (height - padding * 2) * (1 - (p.close - lo) / range);
      return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
    })
    .join(" ");
}

function renderSparkline(points, color, opts) {
  opts = opts || {};
  const width = 320;
  const height = opts.height || 80;
  const padding = 6;
  const values = points.map((p) => p.close);
  let lo = Math.min(...values);
  let hi = Math.max(...values);
  if (opts.high !== undefined && opts.high !== null) hi = Math.max(hi, opts.high);
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", height);
  svg.setAttribute("class", "spark");
  const yOf = (v) => padding + (height - padding * 2) * (1 - (v - lo) / (hi - lo || 1));
  if (opts.high !== undefined && opts.high !== null) {
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", "0");
    line.setAttribute("x2", String(width));
    line.setAttribute("y1", yOf(opts.high).toFixed(1));
    line.setAttribute("y2", yOf(opts.high).toFixed(1));
    line.setAttribute("stroke", "#fabe00");
    line.setAttribute("stroke-width", "1.5");
    line.setAttribute("stroke-dasharray", "5 4");
    line.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(line);
  }
  const pathEl = document.createElementNS(svgNS, "path");
  pathEl.setAttribute("d", sparklinePath(points, width, height, padding, lo, hi));
  pathEl.setAttribute("fill", "none");
  pathEl.setAttribute("stroke", color);
  pathEl.setAttribute("stroke-width", "2");
  pathEl.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(pathEl);
  return svg;
}

function renderChartCard(target) {
  const card = el("div", { className: "panel" });
  if (!target.chart || target.chart.length < 2) {
    card.appendChild(el("h2", { textContent: "走勢" }));
    card.appendChild(el("p", { className: "note", textContent: "資料不足，無法畫出走勢。" }));
    return card;
  }
  const points = target.chart.slice(-60);
  card.appendChild(el("h2", { textContent: "近 " + points.length + " 個交易日走勢" }));
  const ps = target.indicators.pullback_stage;
  card.appendChild(renderSparkline(points, "#da3700", { height: 110, high: ps ? ps.recent_high : null }));
  const closes = points.map((p) => p.close);
  const range = el("div", { className: "range-line" });
  range.appendChild(el("span", { textContent: "最低 " + fmtPrice(Math.min(...closes), target) }));
  range.appendChild(el("span", { textContent: "黃虛線＝30 日高點" }));
  range.appendChild(el("span", { textContent: "最高 " + fmtPrice(Math.max(...closes), target) }));
  card.appendChild(range);
  return card;
}

// ---- 右欄：六個指標，每個一句白話 -----------------------------------

function makeZoneBar(zones, pos) {
  const wrap = el("div", { className: "zonewrap" });
  const bar = el("div", { className: "zonebar" });
  zones.forEach((z) => {
    const part = el("div", { className: "zone " + z.cls });
    part.style.width = z.w + "%";
    bar.appendChild(part);
  });
  wrap.appendChild(bar);
  if (pos !== null && pos !== undefined) {
    const marker = el("div", { className: "zonemark" });
    marker.style.left = (clamp(pos, 0, 1) * 100).toFixed(1) + "%";
    wrap.appendChild(marker);
  }
  const labels = el("div", { className: "zonelabels" });
  zones.forEach((z) => {
    const span = el("span", { textContent: z.label });
    span.style.width = z.w + "%";
    labels.appendChild(span);
  });
  wrap.appendChild(labels);
  return wrap;
}

function signed(value, digits) {
  return (value >= 0 ? "+" : "−") + Math.abs(value).toFixed(digits);
}

function rsiSpec(target) {
  const v = target.indicators.rsi14;
  const spec = {
    key: "rsi14",
    title: "漲跌力道",
    tag: "RSI14",
    plain: "看最近 14 天是漲得多還是跌得多。數字越大越熱、越小越冷。",
    zones: [
      { w: 30, cls: "cold", label: "超賣 <30" },
      { w: 40, cls: "mid", label: "中性" },
      { w: 30, cls: "hot", label: "過熱 >70" },
    ],
  };
  if (v === null || v === undefined) return Object.assign(spec, { value: "資料不足" });
  spec.value = fmt(v, 0);
  spec.pos = v / 100;
  if (v >= 70) Object.assign(spec, { tone: "hot", verdict: "過熱：短線漲太多，追高風險大" });
  else if (v <= 30) Object.assign(spec, { tone: "cold", verdict: "超賣：短線跌太多，可能接近低檔" });
  else if (v >= 50) spec.verdict = "偏強：近期漲得比跌得多";
  else spec.verdict = "偏弱：近期跌得比漲得多";
  return spec;
}

function ma20Spec(target) {
  const ma = target.indicators.ma20;
  const price = target.latest.close;
  const spec = {
    key: "ma20",
    title: "中期趨勢",
    tag: "MA20 月均線",
    plain: "最近 20 天的平均價，當作中期走勢的基準線。現價在上方＝偏多，在下方＝偏弱。",
    zones: [
      { w: 50, cls: "cold", label: "均線之下" },
      { w: 50, cls: "hot", label: "均線之上" },
    ],
  };
  if (ma === null || ma === undefined || !price) return Object.assign(spec, { value: "資料不足" });
  const dev = ((price - ma) / ma) * 100;
  spec.value = fmtPrice(ma, target);
  spec.sub = "現價 " + fmtPrice(price, target);
  spec.pos = (clamp(dev, -5, 5) + 5) / 10;
  if (dev >= 0) Object.assign(spec, { tone: "hot", verdict: "現價在均線之上 " + signed(dev, 1) + "%：中期偏多" });
  else Object.assign(spec, { tone: "cold", verdict: "現價在均線之下 " + signed(dev, 1) + "%：中期偏弱" });
  return spec;
}

function bollingerSpec(target) {
  const b = target.indicators.bollinger;
  const price = target.latest.close;
  const spec = {
    key: "bollinger",
    title: "價格貴不貴",
    tag: "布林通道",
    plain: "用近 20 天畫出「正常波動範圍」。越靠近上緣越貴、越靠近下緣越便宜。",
    zones: [
      { w: 20, cls: "cold", label: "近下緣" },
      { w: 60, cls: "mid", label: "正常範圍" },
      { w: 20, cls: "hot", label: "近上緣" },
    ],
  };
  if (!b || b.upper === null || b.lower === null || b.upper === b.lower || !price) {
    return Object.assign(spec, { value: "資料不足" });
  }
  const pct = ((price - b.lower) / (b.upper - b.lower)) * 100;
  spec.value = Math.round(pct) + "%";
  spec.sub = "通道 " + fmtPrice(b.lower, target) + " ~ " + fmtPrice(b.upper, target);
  spec.pos = pct / 100;
  if (pct >= 100) Object.assign(spec, { tone: "hot", verdict: "衝出上緣：短線偏貴" });
  else if (pct > 80) Object.assign(spec, { tone: "hot", verdict: "貼近上緣：偏貴，容易回落" });
  else if (pct < 0) Object.assign(spec, { tone: "cold", verdict: "跌出下緣：偏便宜，但可能還在殺" });
  else if (pct < 20) Object.assign(spec, { tone: "cold", verdict: "貼近下緣：偏便宜" });
  else spec.verdict = "在正常波動範圍內";
  return spec;
}

function macdSpec(target) {
  const m = target.indicators.macd;
  const price = target.latest.close;
  const spec = {
    key: "macd",
    title: "漲跌動能",
    tag: "MACD",
    plain: "比較短期與長期走勢的差距。快線在慢線之上＝動能偏多，之下＝偏空。",
    zones: [
      { w: 50, cls: "cold", label: "動能偏空" },
      { w: 50, cls: "hot", label: "動能偏多" },
    ],
  };
  if (!m || m.macd === null || m.macd === undefined || !price) {
    return Object.assign(spec, { value: "資料不足" });
  }
  const digits = Math.abs(m.macd) < 1 ? 3 : 2;
  const signals = target.indicators.stage_signals;
  spec.value = signed(m.macd, digits);
  // 訊號線需要比 MACD 本身多 9 天資料；還算不出來時，只用 MACD 的正負判斷短期是否強過長期。
  const hasSignal = m.signal !== null && m.signal !== undefined;
  const hist = hasSignal ? (m.histogram !== null && m.histogram !== undefined ? m.histogram : m.macd - m.signal) : m.macd;
  if (hasSignal) spec.sub = "訊號線 " + signed(m.signal, digits);
  spec.pos = 0.5 + clamp(hist / (price * 0.005), -1, 1) * 0.5;
  if (hist > 0) {
    spec.tone = "hot";
    spec.verdict = hasSignal
      ? "快線在慢線之上：動能偏多" + (signals && signals.macd_golden_cross === true ? "（剛黃金交叉）" : "")
      : "短期走勢強過長期：動能偏多";
  } else {
    spec.tone = "cold";
    spec.verdict = hasSignal ? "快線在慢線之下：動能偏空" : "短期走勢弱於長期：動能偏空";
  }
  return spec;
}

function positionSpec(target) {
  const rp = target.indicators.relative_position;
  const spec = {
    key: "relative_position",
    title: "30 天位置",
    tag: "區間位置",
    plain: "現價落在近 30 天最低到最高之間的哪裡。0% 是最低、100% 是最高。",
    zones: [
      { w: 20, cls: "cold", label: "低點區" },
      { w: 60, cls: "mid", label: "中段" },
      { w: 20, cls: "hot", label: "高點區" },
    ],
  };
  if (!rp) return Object.assign(spec, { value: "資料不足" });
  spec.value = fmt(rp.position * 100, 0) + "%";

  else if (rp.position < 0.2) Object.assign(spec, { tone: "cold", verdict: "接近 30 天最低點：相對便宜" });
  else spec.verdict = "在 30 天區間的中段";
  return spec;
}

function squeezeSpec(target) {
  const vs = target.indicators.volatility_squeeze;
  const spec = {
    key: "volatility_squeeze",
    title: "最近安不安靜",
    tag: "波動壓縮比",
    plain: "最近 5 天的波動 ÷ 近 20 天的波動。越小越安靜，越大越劇烈。",
    zones: [
      { w: 25, cls: "cold", label: "壓縮 <0.5" },
      { w: 35, cls: "mid", label: "正常" },
      { w: 40, cls: "hot", label: "放大 >1.2" },
    ],
  };
  if (!vs || vs.ratio === null || vs.ratio === undefined) return Object.assign(spec, { value: "資料不足" });
  spec.value = fmt(vs.ratio, 2);
  spec.pos = vs.ratio / 2;
  if (vs.ratio < 0.5) Object.assign(spec, { tone: "cold", verdict: "很安靜：常是變盤前兆（方向不一定）" });
  else if (vs.ratio > 1.2) Object.assign(spec, { tone: "hot", verdict: "波動變大：行情在加速" });
  else spec.verdict = "波動正常";
  return spec;
}

function renderIndicatorCard(spec) {
  const card = el("div", { className: "ind" });

  const name = el("div", { className: "ind-name", textContent: spec.title });

  head.appendChild(name);
  const valueBox = el("div", {});
  valueBox.appendChild(el("div", { className: "ind-value", textContent: spec.value }));

  if (spec.pos !== undefined) card.appendChild(makeZoneBar(spec.zones, spec.pos));
  if (spec.verdict) card.appendChild(el("p", { className: "verdict " + (spec.tone || ""), textContent: spec.verdict }));
  card.appendChild(el("p", { className: "plain", textContent: spec.plain }));
  return card;
}

function renderIndicatorSection(target) {

  const head = el("div", { className: "section-head" });

  }
  const big = el("div", { className: "score-big" });
  big.appendChild(el("span", { className: "verdict " + (ts.composite >= 65 ? "cold" : ts.composite < 35 ? "hot" : ""), textContent: ts.label }));

        { w: 35, cls: "hot", label: "偏熱（低分）" },
      ],

    )

  Object.keys(ts.scores).forEach((key) => {

      className: "note",

function renderAiSummary(target) {
  const card = el("div", { className: "panel" });
  card.appendChild(el("h2", { textContent: "AI 推測：今天可能的漲跌原因" }));
  const summary = target.ai_summary;
  if (!summary) {
    card.appendChild(el("p", { className: "note", textContent: "今日摘要暫時無法產生，系統會在下次更新時自動重試。" }));
    return card;
  }
  card.appendChild(el("p", { className: "ai-text", textContent: summary.text }));
  const stale = summary.generated_date && summary.generated_date !== todayIso();
  const dateNote = summary.generated_date ? "（產生日 " + summary.generated_date + (stale ? "，今日新摘要尚未產生" : "") + "）" : "";
  card.appendChild(el("p", { className: "note", style: "margin-top:6px", textContent: summary.disclaimer + dateNote }));
  return card;
}

function todayIso() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function renderMacroCard() {
  const macro = SITE_DATA.macro_context;
  const card = el("div", { className: "panel" });
  card.appendChild(el("h2", { textContent: "美元與金價的關係" }));
  const fxPoints = macro.usdtwd;
  if (fxPoints.length > 0) {
    const latestFx = fxPoints[fxPoints.length - 1];
    const prevFx = fxPoints.length > 1 ? fxPoints[fxPoints.length - 2] : null;
    const big = el("div", { className: "macro-big" });
    big.appendChild(el("span", { className: "num", textContent: fmt(latestFx.close, 3) }));
    if (prevFx) {
      const diff = ((latestFx.close - prevFx.close) / prevFx.close) * 100;
      big.appendChild(el("span", { className: "chg flat", textContent: (diff >= 0 ? "▲ +" : "▼ −") + Math.abs(diff).toFixed(2) + "%" }));
    }
    big.appendChild(el("span", { className: "note", textContent: "美元兌台幣" }));
    card.appendChild(big);
    if (fxPoints.length > 1) card.appendChild(renderSparkline(fxPoints, "#73625c", { height: 54 }));
  }
  const div = macro.divergence;
  if (div && div.checked_days > 0) {
    const row = el("p", { style: "margin-top:6px" });
    row.appendChild(el("span", { className: div.is_divergent ? "chip warn" : "chip ok", textContent: div.is_divergent ? "⚠ 金價與美元同向，不尋常" : "正常反向關係" }));
    card.appendChild(row);
    card.appendChild(
      el("p", {
        className: "note",
        style: "margin-top:6px",
        textContent: "通常美元走弱、金價偏強（兩者反向）。近 " + div.checked_days + " 個有效交易日中，有 " + div.same_direction_days + " 天兩者同向。",
      })
    );
  }
  if (macro.stale) {
    card.appendChild(el("p", { className: "note", style: "margin-top:6px", textContent: "⚠ 資料暫時無法取得，顯示上次成功抓取的結果。" }));
  }
  return card;
}

  const t1 = 3 * scale, t2 = 4 * scale, t3 = 6 * scale, t4 = 9 * scale;
  return [
    "只做中期多頭的黃金。",
    "不在暴漲創高時追價。",
    "回檔 " + t1 + "～" + t2 + "% 開始第一筆 20%。",
    "回檔 " + t2 + "～" + t3 + "%，趨勢沒壞（收盤價在 MA20 之上且未跌破起漲前低）再加 20%。",
    t3 + "～" + t4 + "% 區間出現止跌（RSI14 比 3 天前回升且未創近 3 天新低），再加 20%。",
    "最後 40% 一定等重新轉強（MACD 出現黃金交叉）。",
    "跌破重要前低（起漲低點），立即停止加碼。",

// ---- 我的黃金購買計畫 -------------------------------------------------------
//
// 「金羅盤並不以注意風險為藉口」：不是只提醒有風險，而是陪使用者寫下一份可變動的購買計畫：
// 購買目的、投入邊界、行動條件、下跌情境、檢視時間。表單只建一次（不跟著每 15 秒重畫），
// 跟價格有關的數字（觸發價、下跌時的價位）由 updatePlanOutputs() 跟著即時價更新。
// 內容只存在這台裝置的瀏覽器（localStorage），不會上傳；存不了（無痕模式等）也照常可用。

const PLAN_KEY = "goldCompass.plan.v1";
const PLAN_CODES = ["TBBGOLD", "00635U", "00708L"];
const PLAN_PURPOSES = [
  ["preserve", "長期保值、分散資產"],
  ["goal", "為特定目標存錢（退休、教育等）"],
  ["swing", "想參與金價的漲跌"],
  ["other", "其他（寫在備註）"],
];
const PLAN_HORIZONS = [["lt1", "1 年內"], ["1to3", "1～3 年"], ["3to5", "3～5 年"], ["gt5", "5 年以上"]];
const PLAN_NEED_MONEY = [["no", "不會用到"], ["maybe", "可能會用到"], ["yes", "一定會用到"]];
const PLAN_REVIEW_EVERY = [["month", "每個月", 1], ["quarter", "每季", 3], ["half", "每半年", 6]];
const PLAN_TRIGGERS = [
  ["income", "收入或工作有變動"],
  ["spending", "接下來有大筆支出（買房、學費、醫療）"],
  ["goal", "購買目的或持有期間改變"],
  ["loss", "虧損超過我能接受的上限"],
  ["family", "家庭狀況改變（結婚、生子、照顧家人）"],
];
const PLAN_DROPS = [5, 10, 20, 30];

let PLAN = null;
const PLAN_UI = {};

function planDefaults() {
  const code = PLAN_CODES.indexOf(currentTargetCode) >= 0 ? currentTargetCode : "TBBGOLD";
  return {
    code: code,
    purpose: "preserve",
    purposeNote: "",
    horizon: "3to5",
    budget: "",
    monthly: "",
    extra: "",
    conditions: { pullback: true, priorLow: true, keepMonthly: true, lossLimit: true },
    customCondition: "",
    maxLossPct: "15",
    needMoney: "no",
    reviewEvery: "quarter",
    nextReview: addMonthsIso(new Date(), 3),
    triggers: { income: true, spending: true, goal: true, loss: true, family: false },
    updatedAt: null,
  };
}

function loadPlan() {
  const base = planDefaults();
  try {
    const saved = JSON.parse(localStorage.getItem(PLAN_KEY) || "null");
    if (saved && typeof saved === "object") {
      return Object.assign(base, saved, {
        conditions: Object.assign(base.conditions, saved.conditions || {}),
        triggers: Object.assign(base.triggers, saved.triggers || {}),
        code: PLAN_CODES.indexOf(saved.code) >= 0 ? saved.code : base.code,
      });
    }
  } catch (error) {
    /* 讀不到就用預設值 */
  }
  return base;
}

function savePlan() {
  PLAN.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN));
  } catch (error) {
    /* 無痕模式等存不了：計畫照常可用，只是重新整理後不會保留 */
  }
}

function addMonthsIso(date, months) {
  const d = new Date(date.getFullYear(), date.getMonth() + months, date.getDate());
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function planNum(value) {
  const n = parseFloat(String(value === undefined || value === null ? "" : value).replace(/,/g, ""));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function money(n) {
  return Math.round(n).toLocaleString("en-US") + " 元";
}

function optionLabel(list, value) {
  const hit = list.find((item) => item[0] === value);
  return hit ? hit[1] : "";
}

function planTarget() {
  return SITE_DATA.targets[PLAN.code] || null;
}

// 這個標的的單位價格說明，例如「元／公克」；ETF 是「元」。
function planUnit(target) {
  return target && target.code === "TBBGOLD" ? " 元／公克" : " 元";
}

function planChanged(key, value) {
  PLAN[key] = value;
  savePlan();
  updatePlanOutputs();
}

function planSelect(list, key) {
  const select = el("select", {});
  list.forEach((item) => select.appendChild(el("option", { value: item[0], textContent: item[1] })));
  select.value = PLAN[key];
  select.addEventListener("change", () => planChanged(key, select.value));
  return select;
}

function planNumber(key, placeholder, step) {
  const input = el("input", { type: "number", min: "0", step: step || "1000", inputMode: "numeric", placeholder: placeholder || "" });
  input.value = PLAN[key];
  input.addEventListener("input", () => planChanged(key, input.value));
  return input;
}

function planText(key, placeholder) {
  const input = el("input", { type: "text", maxLength: 120, placeholder: placeholder || "" });
  input.value = PLAN[key];
  input.addEventListener("input", () => planChanged(key, input.value));
  return input;
}

function planField(label, control, hint) {
  const wrap = el("label", { className: "plan-field" });
  wrap.appendChild(document.createTextNode(label));
  if (hint) wrap.appendChild(el("small", { textContent: hint }));
  wrap.appendChild(control);
  return wrap;
}

function planCheck(group, key, labelNode) {
  const wrap = el("label", { className: "plan-check" });
  const box = el("input", { type: "checkbox" });
  box.checked = !!PLAN[group][key];
  box.addEventListener("change", () => {
    PLAN[group][key] = box.checked;
    savePlan();
    updatePlanOutputs();
  });
  wrap.appendChild(box);
  wrap.appendChild(labelNode);
  return wrap;
}

function planStep(no, title, lead) {
  const step = el("div", { className: "plan-step" });

  h.appendChild(el("span", { className: "no", textContent: String(no) }));
  h.appendChild(document.createTextNode(title));
  step.appendChild(h);
  step.appendChild(el("p", { className: "lead", textContent: lead }));
  return step;
}

  PLAN_TRIGGERS.forEach((item) => triggers.appendChild(planCheck("triggers", item[0], el("span", { textContent: item[1] }))));
  s5.appendChild(triggers);
  grid.appendChild(s5);

  body.appendChild(grid);

  // 計畫摘要：可複製、可列印成 PDF
  const summary = el("div", { className: "plan-summary", id: "plan-summary" });
  summary.appendChild(el("h3", { textContent: "我的黃金購買計畫" }));
  PLAN_UI.summaryText = el("pre", {});
  summary.appendChild(PLAN_UI.summaryText);
  const actions = el("div", { className: "plan-actions" });
  const copy = el("button", { type: "button", className: "primary", textContent: "複製計畫文字" });
  copy.addEventListener("click", () => copyPlanText(copy));
  const print = el("button", { type: "button", textContent: "列印／存成 PDF" });
  print.addEventListener("click", () => window.print());
  const reset = el("button", { type: "button", textContent: "清除重填" });
  reset.addEventListener("click", () => {
    if (!window.confirm("確定要清除這份計畫，重新填寫嗎？")) return;
    try {
      localStorage.removeItem(PLAN_KEY);
    } catch (error) {
      /* 忽略 */
    }
    renderPlan();
  });
  actions.appendChild(copy);
  actions.appendChild(print);
  actions.appendChild(reset);
  actions.appendChild(el("span", { className: "note", textContent: "內容只存在這台裝置的瀏覽器，不會上傳。僅供個人規劃參考，不構成投資建議。" }));
  summary.appendChild(actions);
  body.appendChild(summary);

  host.appendChild(body);
  updatePlanOutputs();
}

function copyPlanText(button) {
  const text = PLAN_UI.summaryText.textContent;
  const done = () => {
    button.textContent = "已複製";
    setTimeout(() => (button.textContent = "複製計畫文字"), 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => window.prompt("請手動複製：", text));
  } else {
    window.prompt("請手動複製：", text);
  }
}

// 依目前選的標的與最新價格，算出觸發價、下跌時的價位與損失，並重寫摘要。
function updatePlanOutputs() {
  if (!PLAN || !PLAN_UI.summaryText) return;
  const target = planTarget();
  if (!target) return;
  const unit = planUnit(target);
  const price = target.latest.close;
  const ps = target.indicators.pullback_stage;
  const scale = target.pullback_scale || 1;
  const firstPct = 3 * scale;
  const firstPrice = ps && ps.recent_high ? ps.recent_high * (1 - firstPct / 100) : null;
  const priorLow = target.indicators.prior_low;
  const priorBroken = !priorLow && target.indicators.prior_low_broken === true;
  const budget = planNum(PLAN.budget);
  const monthly = planNum(PLAN.monthly);
  const extra = planNum(PLAN.extra);
  const maxLoss = Math.min(planNum(PLAN.maxLossPct), 100);
  const lossPrice = maxLoss ? price * (1 - maxLoss / 100) : null;
  const name = SHORT_NAMES[target.code] || target.display_name;

  // 1. 購買目的的提醒
  const purposeWarnings = [];
  if (PLAN.code === "00708L" && PLAN.horizon !== "lt1") {
    purposeWarnings.push("00708L 是 2 倍槓桿、每日重設，長期持有會偏離金價走勢，比較不適合 1 年以上的計畫。");
  }
  if (PLAN.horizon === "lt1" && PLAN.purpose !== "swing") {
    purposeWarnings.push("持有不到 1 年時，金價短期波動可能讓你在虧損時就得賣出，目標金額要保守一點。");
  }
  PLAN_UI.purposeWarn.textContent = purposeWarnings.join(" ");
  PLAN_UI.purposeWarn.hidden = purposeWarnings.length === 0;

  // 2. 投入邊界
  const yearly = monthly * 12 + extra;
  let budgetText;
  if (!budget) {
    budgetText = "先填總預算，下面的下跌情境才算得出金額。";
  } else {
    budgetText = "總預算 " + money(budget) + "。";
    if (monthly) budgetText += "每月定期 " + money(monthly) + "，約 " + Math.floor(budget / monthly) + " 個月會投滿。";
    if (yearly > budget) budgetText += " ⚠ 一年的定期投入加上額外加碼（" + money(yearly) + "）已超過總預算，請調整。";
  }
  PLAN_UI.budgetOut.textContent = budgetText;

  // 3. 行動條件（數字跟著即時價走）
  PLAN_UI.condPullback.textContent =
    "回檔達 " + firstPct + "%" + (firstPrice ? "（約 " + fmtPrice(firstPrice, target) + unit + "）" : "") + "才考慮第一筆，之後照站上的分批紀律";
  PLAN_UI.condPriorLow.textContent = priorLow
    ? "跌破起漲前低 " + fmtPrice(priorLow.price, target) + unit + "時停止加碼、重新評估"
    : "跌破起漲前低時停止加碼、重新評估" + (priorBroken ? "（目前已跌破所有前低）" : "");
  PLAN_UI.condLossLimit.textContent = lossPrice
    ? "比現在跌超過 " + maxLoss + "%（約 " + fmtPrice(lossPrice, target) + unit + "）時，重新檢視整份計畫"
    : "跌超過我能接受的虧損時，重新檢視整份計畫";
  PLAN_UI.stageOut.innerHTML = "";
  PLAN_UI.stageOut.appendChild(document.createTextNode(name + " 現價 "));
  PLAN_UI.stageOut.appendChild(el("b", { textContent: fmtPrice(price, target) + unit }));
  if (ps) {
    PLAN_UI.stageOut.appendChild(document.createTextNode("，從近 30 天高點回檔 " + fmt(ps.pullback_pct, 1) + "%，目前落在「" + ps.stage + "」。"));
  }

  // 4. 下跌情境
  const table = PLAN_UI.dropTable;
  table.innerHTML = "";
  const head = el("tr", {});
  ["價格下跌", "價格約", budget ? "總預算可能虧損" : "每 10 萬元可能虧損"].forEach((text) => head.appendChild(el("th", { textContent: text })));
  table.appendChild(head);
  const base = budget || 100000;
  PLAN_DROPS.forEach((pct) => {
    const row = el("tr", { className: maxLoss && pct > maxLoss ? "over" : "" });
    row.appendChild(el("td", { textContent: "跌 " + pct + "%" + (maxLoss && pct > maxLoss ? "（超過可接受）" : "") }));
    row.appendChild(el("td", { textContent: fmtPrice(price * (1 - pct / 100), target) + unit }));
    row.appendChild(el("td", { textContent: money((base * pct) / 100) }));
    table.appendChild(row);
  });
  PLAN_UI.dropNote.textContent =
    "以目前價格、總預算全部投入估算；分批買進的實際平均成本會不同。" +
    (PLAN.code === "00708L" ? "00708L 是 2 倍槓桿：金價跌 10%，它大約跌 20%（每日重設，實際會偏離）。" : "");
  const moneyWarnings = [];
  if (PLAN.needMoney !== "no") {
    moneyWarnings.push("持有期間" + (PLAN.needMoney === "yes" ? "一定" : "可能") + "會用到這筆錢：下跌時可能被迫在低點賣出。建議把會用到的部分移出總預算，只用短期內不會動用的錢。");
  }
  if (maxLoss && budget && maxLoss < 10) {
    moneyWarnings.push("可接受虧損低於 10%：黃金一年內跌 10% 以上並不少見，可以考慮降低總預算。");
  }
  PLAN_UI.moneyWarn.textContent = moneyWarnings.join(" ");
  PLAN_UI.moneyWarn.hidden = moneyWarnings.length === 0;

  // 摘要
  const lines = [];
  const updated = PLAN.updatedAt ? new Date(PLAN.updatedAt) : new Date();
  lines.push("更新：" + updated.getFullYear() + "/" + (updated.getMonth() + 1) + "/" + updated.getDate());
  lines.push("");
  lines.push("1. 購買目的：" + optionLabel(PLAN_PURPOSES, PLAN.purpose) + "；預計持有 " + optionLabel(PLAN_HORIZONS, PLAN.horizon) + "。" + (PLAN.purposeNote ? "備註：" + PLAN.purposeNote : ""));
  lines.push(
    "2. 投入邊界：" + name + "；總預算 " + (budget ? money(budget) : "（未填）") +
      (monthly ? "；每月定期 " + money(monthly) : "") + (extra ? "；額外加碼預算 " + money(extra) : "") + "。"
  );
  lines.push("3. 行動條件：");
  if (PLAN.conditions.pullback) lines.push("・" + PLAN_UI.condPullback.textContent);
  if (PLAN.conditions.priorLow) lines.push("・" + PLAN_UI.condPriorLow.textContent);
  if (PLAN.conditions.keepMonthly) lines.push("・" + PLAN_UI.condKeepMonthly.textContent);
  if (PLAN.conditions.lossLimit) lines.push("・" + PLAN_UI.condLossLimit.textContent);
  if (PLAN.customCondition) lines.push("・" + PLAN.customCondition);
  lines.push(
    "4. 下跌情境：以目前 " + fmtPrice(price, target) + unit + "估算，" +
      PLAN_DROPS.map((pct) => "跌 " + pct + "% 約虧 " + money((base * pct) / 100)).join("、") +
      (budget ? "" : "（以每 10 萬元計）") + "。" +
      (maxLoss ? "我最多能接受虧損 " + maxLoss + "%" + (budget ? "（約 " + money((budget * maxLoss) / 100) + "）" : "") + "。" : "") +
      "持有期間" + optionLabel(PLAN_NEED_MONEY, PLAN.needMoney) + "這筆錢。"
  );
  const chosenTriggers = PLAN_TRIGGERS.filter((item) => PLAN.triggers[item[0]]).map((item) => item[1]);
  lines.push(
    "5. 檢視時間：" + optionLabel(PLAN_REVIEW_EVERY, PLAN.reviewEvery) + "回顧一次，下次 " + (PLAN.nextReview || "（未填）") + "。" +
      (chosenTriggers.length ? "遇到以下情況就重設計畫：" + chosenTriggers.join("、") + "。" : "")
  );
  lines.push("");
  lines.push("這份計畫依金羅盤 " + (SITE_DATA.generated_at || "").slice(0, 10) + " 的資料試算，僅供個人規劃參考，不構成投資建議。");
  PLAN_UI.summaryText.textContent = lines.join("\n");
}

// ---- AI 小幫手「金福企」（聊天視窗）-------------------------------------------
//
// 對話送到 Worker 的 /chat，由它帶上站上最新資料、先由程式算好試算結果，再交給 Cloudflare Workers AI 用白話說明。
// 網頁只知道 Worker 網址，不碰任何金鑰。對話只存在這個頁面的記憶體裡，關掉頁面就清掉。

const ASSISTANT = { busy: false, messages: [], log: null, input: null, send: null, chips: null, panel: null, fab: null };
const ASSISTANT_LIMITS = { messages: 8, total: 5000, assistantChars: 1500 };

function assistantErrorText(status, code) {
  if (status === 503 || code === "not_configured") return "金福企還沒啟用，其他功能不受影響。";
  if (code === "rate_limited") return "問得有點快，請過幾分鐘再試。";
  if (code === "daily_limit") return "今天的提問次數已達上限，明天再來問吧。";
  if (code === "message_too_long" || code === "too_many_messages") return "這段對話太長了，請重新整理頁面再開始。";
  return "金福企暫時無法使用，請稍後再試。";
}

function buildSendMessages() {
  const list = ASSISTANT.messages
    .filter((m) => !m.skip)
    .map((m) => ({ role: m.role, content: m.role === "assistant" ? m.content.slice(0, ASSISTANT_LIMITS.assistantChars) : m.content }));
  const total = () => list.reduce((sum, m) => sum + m.content.length, 0);
  // 太長就丟掉最舊的；而且一定要從使用者的訊息開始。
  while (list.length > ASSISTANT_LIMITS.messages || total() > ASSISTANT_LIMITS.total || (list.length && list[0].role !== "user")) {
    list.shift();
  }
  return list;
}

function plainAssistantText(text) {
  return text.replace(/\*\*/g, "").replace(/^\s{0,3}#+\s*/gm, "").replace(/^\s*[*-]\s+/gm, "• ");
}

function addAssistantBubble(role, text, extraClass) {
  const bubble = el("div", { className: "msg " + role + (extraClass ? " " + extraClass : ""), textContent: role === "assistant" ? plainAssistantText(text) : text });
  ASSISTANT.log.appendChild(bubble);
  ASSISTANT.log.scrollTop = ASSISTANT.log.scrollHeight;
  return bubble;
}

function setAssistantBusy(busy) {
  ASSISTANT.busy = busy;
  ASSISTANT.send.disabled = busy;
  ASSISTANT.input.disabled = busy;
  if (!busy) ASSISTANT.input.focus();
}

async function sendAssistantMessage(rawText) {
  const text = rawText.trim();
  if (!text || ASSISTANT.busy) return;
  const userMessage = { role: "user", content: text };
  ASSISTANT.messages.push(userMessage);
  addAssistantBubble("user", text);
  ASSISTANT.input.value = "";
  setAssistantBusy(true);
  const typing = addAssistantBubble("assistant", "思考中…", "typing");
  try {
    const res = await fetch(SITE_DATA.assistant_url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: buildSendMessages(), code: currentTargetCode }),
    });
    let data = null;
    try {
      data = await res.json();
    } catch (e) {
      data = null;
    }
    typing.remove();
    if (res.ok && data && data.reply) {
      ASSISTANT.messages.push({ role: "assistant", content: data.reply });
      addAssistantBubble("assistant", data.reply);
    } else {
      userMessage.skip = true; // 這一輪失敗，不要把它帶進下一次的上下文
      addAssistantBubble("assistant", assistantErrorText(res.status, data && data.error), "error");
    }
  } catch (e) {
    typing.remove();
    userMessage.skip = true;
    addAssistantBubble("assistant", "網路連不上，請稍後再試。", "error");
  } finally {
    setAssistantBusy(false);
  }
}

function assistantSuggestions() {
  const target = SITE_DATA.targets[currentTargetCode];
  const ps = target && target.indicators.pullback_stage;
  const stage = ps ? STAGE_SHORT[stageIndex(ps.stage)] : null;
  const name = target ? shortName(target) : "這個標的";
  return [
    stage ? "為什麼「" + name + "」現在是「" + stage + "」階段？" : "現在是什麼階段？",
    "RSI、布林通道、MACD 各代表什麼？",
    "我有 10 萬元，幫我算分批計畫",
    "存摺和 ETF 哪個成本低？",
    "我是新手，要怎麼開始買黃金？",
    "「我的黃金購買計畫」要怎麼填？",
  ];
}

function updateAssistantChips() {
  if (!ASSISTANT.chips) return;
  ASSISTANT.chips.innerHTML = "";
  assistantSuggestions().forEach((text) => {
    const chip = el("button", { type: "button", textContent: text });
    chip.addEventListener("click", () => sendAssistantMessage(text));
    ASSISTANT.chips.appendChild(chip);
  });
}

function setAssistantOpen(open) {
  ASSISTANT.panel.classList.toggle("open", open);
  ASSISTANT.fab.setAttribute("aria-expanded", open ? "true" : "false");
  ASSISTANT.fab.textContent = open ? "收起金福企" : "問金福企";
  if (open) ASSISTANT.input.focus();
}

function initAssistant() {
  if (!SITE_DATA.assistant_url) return;
  const fab = el("button", { className: "assistant-fab", type: "button", textContent: "問金福企" });
  fab.setAttribute("aria-expanded", "false");
  fab.setAttribute("aria-controls", "assistant-panel");
  const panel = el("section", { className: "assistant-panel", id: "assistant-panel" });
  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-label", "金羅盤 AI 小幫手：金福企");

  const head = el("div", { className: "assistant-head" });
  head.appendChild(el("b", { textContent: "金福企　金羅盤 AI 小幫手" }));
  const close = el("button", { type: "button", textContent: "×" });
  close.setAttribute("aria-label", "關閉金福企");
  head.appendChild(close);
  panel.appendChild(head);

  const log = el("div", { className: "assistant-log" });
  log.setAttribute("aria-live", "polite");
  panel.appendChild(log);

  const chips = el("div", { className: "assistant-chips" });
  panel.appendChild(chips);

  const form = el("form", { className: "assistant-form" });
  const input = el("input", { type: "text", maxLength: 500, placeholder: "輸入問題，例如：RSI 是什麼？" });
  input.setAttribute("aria-label", "輸入問題");
  const send = el("button", { type: "submit", textContent: "送出" });
  form.appendChild(input);
  form.appendChild(send);
  panel.appendChild(form);
  panel.appendChild(
    el("p", { className: "assistant-note", textContent: "金福企根據本站最新數據回答，會用程式計算數字；不給買賣指令，也不知道新聞。僅供研究參考。" })
  );

  Object.assign(ASSISTANT, { log: log, input: input, send: send, chips: chips, panel: panel, fab: fab });
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    sendAssistantMessage(input.value);
  });
  fab.addEventListener("click", () => setAssistantOpen(!panel.classList.contains("open")));
  close.addEventListener("click", () => setAssistantOpen(false));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && panel.classList.contains("open")) setAssistantOpen(false);
  });

  addAssistantBubble(
    "assistant",
    "嗨，我是金福企，金羅盤的 AI 小幫手。可以幫你：\n• 解釋指標和目前的階段\n• 試算分批計畫（告訴我預算）\n• 比較黃金存摺和 ETF 的成本\n• 新手開戶導覽\n• 說明下方「我的黃金購買計畫」怎麼填\n點下面的問題，或直接輸入。"
  );
  updateAssistantChips();
  document.body.appendChild(fab);
  document.body.appendChild(panel);
}

function refreshSiteData() {
  fetch("data/gold_site.json?ts=" + Date.now())
    .then((res) => (res.ok ? res.json() : null))
    .then((fresh) => {
      if (!fresh) return;
      Object.assign(SITE_DATA, fresh);
      renderDisclaimer();
      renderTargetTabs();
      renderTarget(currentTargetCode || orderedCodes()[0]);
      markPageUpdatedNow();
    })
    .catch(() => {});
}

// 報價優先向 Cloudflare Worker 即時取得（不受 GitHub Actions 排程延遲影響）；
// Worker 連不上、或兩個資料來源都沒資料時，退回建站時一併發布的靜態 JSON。
function fetchLiveQuotes() {
  const fetchStatic = () =>
    fetch("data/live_quotes.json?ts=" + Date.now()).then((res) => (res.ok ? res.json() : null));
  if (!SITE_DATA.live_quotes_url) return fetchStatic();
  return fetch(SITE_DATA.live_quotes_url + "?ts=" + Date.now())
    .then((res) => (res.ok ? res.json() : null))
    .then((fresh) => (fresh && fresh.quotes && Object.keys(fresh.quotes).length ? fresh : fetchStatic()))
    .catch(fetchStatic);
}

function refreshLiveQuotes() {
  fetchLiveQuotes()
    .then((fresh) => {
      if (!fresh) return;
      SITE_DATA.live_quotes_generated_at = fresh.generated_at;
      if (fresh.quotes) {
        Object.keys(fresh.quotes).forEach((code) => {
          const target = SITE_DATA.targets[code];
          if (target) Object.assign(target.latest, fresh.quotes[code]);
        });
      }
      // 就算這次沒有任何標的的報價值真的變，查核時間本身也是新的，
      // 一律重繪，讓「查核仍為最新」的時間跟著這次輪詢往前走。
      renderTargetTabs();
      if (currentTargetCode) renderTarget(currentTargetCode);
      markPageUpdatedNow();
    })
    .catch(() => {});
}

renderDisclaimer();
currentTargetCode = orderedCodes()[0];
renderTargetTabs();
renderTarget(currentTargetCode);
renderPlan();
// 從封面「建立我的購買計畫」連過來（dashboard.html#plan）：計畫區是 JS 產生的，瀏覽器自己捲不到，手動捲過去。
if (location.hash === "#plan") document.getElementById("plan").scrollIntoView();
initAssistant();
markPageUpdatedNow();
if (SITE_DATA.auto_refresh_seconds) {
  setInterval(refreshSiteData, SITE_DATA.auto_refresh_seconds * 1000);
}
if (SITE_DATA.live_refresh_seconds) {
  setInterval(refreshLiveQuotes, SITE_DATA.live_refresh_seconds * 1000);
}
</script>
