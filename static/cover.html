<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金羅盤</title>
<style>
  @keyframes needleSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes ringDrift {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50% { opacity: 0.65; transform: scale(1.08); }
  }
  @keyframes titleRise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Helvetica, Arial, sans-serif; }
  .cover {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 42%, #2a1d0c 0%, #150e05 42%, #060402 78%, #020101 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 4vh, 34px);
    padding: 24px;
  }
  .brand {
    text-align: center;
    animation: titleRise 1.1s ease-out both;
  }
  .brand-title {
    margin: 0;
    font-size: clamp(30px, 6vw, 48px);
    font-weight: 700;
    letter-spacing: 0.18em;
    background: linear-gradient(180deg, #ffe9b8 0%, #d9a54a 55%, #a6772a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 18px rgba(217, 165, 74, 0.35);
  }
  .brand-subtitle {
    margin: 6px 0 0;
    font-size: clamp(11px, 1.6vw, 13px);
    letter-spacing: 0.5em;
    color: rgba(233, 197, 128, 0.55);
    text-transform: uppercase;
  }
  .compass-wrap {
    position: relative;
    width: min(46vw, 260px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .compass-glow {
    position: absolute;
    inset: -18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230, 178, 87, 0.55) 0%, rgba(230, 178, 87, 0) 70%);
    animation: glowPulse 4.5s ease-in-out infinite;
    pointer-events: none;
  }
  .compass-svg {
    position: relative;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.55));
  }
  .compass-ring {
    transform-origin: 150px 150px;
    animation: ringDrift 90s linear infinite;
  }
  .compass-needle {
    transform-origin: 150px 150px;
    animation: needleSpin 48s linear infinite;
  }
  .enter-button {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 34px;
    background: rgba(230, 178, 87, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(230, 178, 87, 0.45);
    border-radius: 999px;
    color: #f3d9a4;
    font-size: 15px;
    letter-spacing: 0.35em;
    text-decoration: none;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }
  .enter-button:hover {
    background: rgba(230, 178, 87, 0.18);
    border-color: rgba(230, 178, 87, 0.75);
    box-shadow: 0 8px 28px rgba(230, 178, 87, 0.25);
    transform: translateY(-1px);
  }
  .enter-button:active {
    transform: translateY(0);
    background: rgba(230, 178, 87, 0.24);
  }
  @media (prefers-reduced-motion: reduce) {
    .compass-ring, .compass-needle, .compass-glow, .brand { animation: none; }
  }
</style>
</head>
<body>
<div class="cover">
  <div class="brand">
    <h1 class="brand-title">金羅盤</h1>
    <p class="brand-subtitle">Gold Compass</p>
  </div>

  <div class="compass-wrap">
    <div class="compass-glow"></div>
    <svg class="compass-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <circle cx="150" cy="150" r="128" fill="none" stroke="rgba(230,178,87,0.28)" stroke-width="1.5" />
      <circle cx="150" cy="150" r="104" fill="none" stroke="rgba(230,178,87,0.16)" stroke-width="1" />

      <g class="compass-ring" stroke="rgba(230,178,87,0.55)" stroke-width="2" stroke-linecap="round">
        <line x1="150" y1="18" x2="150" y2="40" />
        <line x1="150" y1="260" x2="150" y2="282" />
        <line x1="18" y1="150" x2="40" y2="150" />
        <line x1="260" y1="150" x2="282" y2="150" />
      </g>
      <g class="compass-ring" stroke="rgba(230,178,87,0.28)" stroke-width="1.3" stroke-linecap="round">
        <line x1="150" y1="26" x2="150" y2="40" transform="rotate(30 150 150)" />
        <line x1="150" y1="26" x2="150" y2="40" transform="rotate(60 150 150)" />
        <line x1="150" y1="26" x2="150" y2="40" transform="rotate(120 150 150)" />
        <line x1="150" y1="26" x2="150" y2="40" transform="rotate(150 150 150)" />
        <line x1="150" y1="26" x2="150" y2="40" transform="rotate(210 150 150)" />
        <line x1="150" y1="26" x2="150" y2="40" transform="rotate(240 150 150)" />
        <line x1="150" y1="26" x2="150" y2="40" transform="rotate(300 150 150)" />
        <line x1="150" y1="26" x2="150" y2="40" transform="rotate(330 150 150)" />
      </g>

      <polygon points="150,142 145,150 150,158 155,150" fill="rgba(230,178,87,0.85)" />
      <text x="150" y="34" text-anchor="middle" font-size="15" letter-spacing="2"
            fill="rgba(243,217,164,0.85)" font-weight="700">N</text>

      <g class="compass-needle">
        <polygon points="150,58 160,150 140,150" fill="#f0c878" />
        <polygon points="150,242 160,150 140,150" fill="#7a5220" />
      </g>
      <circle cx="150" cy="150" r="7" fill="#f3d9a4" stroke="#3a2a10" stroke-width="1.5" />
    </svg>
  </div>

  <a class="enter-button" href="dashboard.html">Enter</a>
</div>
</body>
</html>
