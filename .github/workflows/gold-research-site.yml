name: Deploy gold-etf-research site

on:
  # GitHub owns the refresh schedule; do not depend on the external Worker token.
  # UTC below = Asia/Taipei minus 8 hours. Schedules may be delayed by GitHub.
  schedule:
    # Weekdays 09:00–13:30 Asia/Taipei, including the closing tick.
    - cron: '*/5 1-4 * * 1-5'
    - cron: '0-30/5 5 * * 1-5'
    # Fetch daily bars again at 15:17 and 16:17 Taipei after the close.
    - cron: '17 7,8 * * 1-5'
    - cron: '17 9-23 * * 1-5'
    - cron: '17 * * * 0,6'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "忽略交易時段限制，強制抓一次 TWSE 最新資料（手動補資料用）"
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publishers so an older build cannot overwrite a newer deployment.
concurrency:
  group: gold-research-site-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SITE_PAT: ${{ secrets.GOLD_RESEARCH_SITE_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require publishing credentials
        run: |
          if [ "$HAS_SITE_PAT" != "true" ]; then
            echo "::error::GOLD_RESEARCH_SITE_PAT is missing; the site cannot be published."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # LINE 通知改由 Cloudflare Worker（quote-worker/）用即時價發送；這裡刻意不再
          # 傳 LINE_CHANNEL_ACCESS_TOKEN，避免同一個加碼點被建站流程重複通知一次。
          FORCE_TWSE_FETCH: ${{ github.event_name == 'push' || github.event.inputs.force_fetch == 'true' || github.event.schedule == '17 7,8 * * 1-5' }}
        run: |
          uv run python -m gold_research.update_quotes
          uv run python -m gold_research.build_site

      - name: Check site data
        run: uv run python -m gold_research.health_check

      # 建置完的靜態網頁另外推到公開的 yanting20050326-debug/gold-research-site
      # (https://yanting20050326-debug.github.io/gold-research-site/)，維持跟
      # 拆分前一致的公開網址，不用搬家。需要一組有該 repo 寫入權限的 PAT，
      # 存在這個 repo 的 Settings > Secrets > Actions，命名為
      # GOLD_RESEARCH_SITE_PAT——這組 token 只有人類能在
      # github.com/settings/tokens 建立；未設定時前面的檢查會明確報錯。
      - name: Publish to public gold-research-site repo
        if: ${{ env.HAS_SITE_PAT == 'true' }}
        env:
          GOLD_RESEARCH_SITE_PAT: ${{ secrets.GOLD_RESEARCH_SITE_PAT }}
        run: |
          git clone "https://${GOLD_RESEARCH_SITE_PAT}@github.com/yanting20050326-debug/gold-research-site.git" /tmp/gold-research-site
          rm -rf /tmp/gold-research-site/*
          cp -r site/. /tmp/gold-research-site/
          cd /tmp/gold-research-site
          git config user.name "gold-research-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "no changes" || git commit -m "chore: auto-update site $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main
